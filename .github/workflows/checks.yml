name: Checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: NickelTypeFix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nicoverbruggen/nickelbench:recent

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Build
        run: make clean all strip koboroot

      - name: Check interface
        run: test/interface/check.sh

      - name: Check firmware compatibility
        run: nickelbench check-source src

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: NickelTypeFix
          path: |
            KoboRoot.tgz
            src/libnickeltypefix.so

  anchors:
    name: Byte-patch anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache firmware libs
        uses: actions/cache@v4
        with:
          # Key on the tracked firmware list. When it changes (a build added via
          # mkfwlist.go) the key changes; restore-keys pulls the previous corpus so
          # only the new libs download.
          path: test/anchors/corpus
          key: qt-corpus-v2-${{ hashFiles('test/anchors/firmwares.tsv') }}
          restore-keys: qt-corpus-v2-

      - name: Validate anchors
        working-directory: test/anchors
        run: go run .
